name: code-craft-v1
label: 代码工坊与洁净室门禁流程
version: "1.0"
description: 单工位 TDD 紧反馈工坊 + 外环洁净室门禁架构 (代码工坊 -> 洁净室测试 / 洁净室评审 -> 收尾)。适用于明确 Bug 修复、局部重构、小范围功能等需求清晰聚焦的敏捷任务。

reverification:
  version: selective-reverification-v1
  cleanroom_test:
    reusable_only_if_changes_within:
      - "docs/**/*.md"
  cleanroom_review:
    reusable_only_if_changes_within: []

selective_replan:
  version: selective-replan-v1
  mode: explicit_task_targets
  retry_node: craft

nodes:
  - id: craft
    max_tasks_per_node: 4
    label: 1代码工坊
    node_type: agent
    depends_on: []
    parallel: false
    purpose: 单工位闭环研发工坊：在单一工作区内闭环完成需求澄清、测试驱动先行（TDD RED->GREEN->REFACTOR）、自测验证与代码提交，杜绝跨工位频繁握手带来的上下文丢失。
    default_integration_mode: git
    default_task_type: feat
    agent_policy:
      preferred: [agy, claude, codex, opencode, qodercli, pi, grok, kimi]
      max_concurrency: 1
      parallel: false
      allow_soft_degrade: true
    required_outputs:
      - 代码实现
      - 失败测试与转绿验证记录（RED-GREEN）
      - 重构自测与修改文件清单
      - 交付基线核验记录（verify-baseline）
    rules:
      - "单工位 TDD 紧反馈工坊：单一工位闭环执行需求澄清、测试驱动（编写失败测试先行 RED -> 最小实现转绿 GREEN -> 局部重构自测 REFACTOR），坚决杜绝在工坊内部拆分子任务开设多个 Pane 制造合并死锁与上下文撕裂。"
      - "严格限定单 Task / 单 Pane 串行推进（max_concurrency: 1，parallel: false）。"
      - "严禁随意切换或重命名 Git 分支，修改范围必须严格限制在 Task 目标内，以 verify-baseline 为准。"
      - "开启柔性降级（allow_soft_degrade: true）：在工位候选 Agent 受限时支持安全降级，保障单工位研发畅通。"
      - "创建 Task 时默认使用 --agent auto，由 Agent Router 结合节点策略与可用 Agent 动态路由。"

  - id: cleanroom_test
    max_tasks_per_node: 4
    label: 2洁净室测试
    node_type: agent
    depends_on: [craft]
    parallel: false
    purpose: 外环洁净室黑盒独立测试门禁：由独立工位运行全量测试套件与异常边界，客观检验候选版本正确性。与洁净室评审并行就绪，验证同一冻结 candidate_sha。
    default_integration_mode: none
    default_task_type: test
    agent_policy:
      preferred: [codex, opencode, qodercli, claude, agy, pi, grok, kimi]
      max_concurrency: 1
      parallel: false
      exclude_stage_agents: [craft]
      allow_soft_degrade: true
    gate:
      retry_node: craft
    required_outputs:
      - 测试执行记录
      - 缺陷清单
      - 回归测试结果
      - 极端边界条件核验情况
      - "门禁测试结论（HERDR_GATE_VERDICT: pass / blocked）"
      - 本地服务启动与候选版本核验记录（命令、工作目录、URL、隔离环境）
      - ego-browser 真实 E2E 报告（步骤、预期/实际结果、业务主路径及失败边界）
      - E2E 截图/浏览器记录与状态回读证据（绑定候选 SHA 和 Task/Run）
    rules:
      - 真实 E2E 为本测试节点必过门禁：必须在隔离测试环境启动当前冻结候选版本的本地服务，执行真实端到端测试；不得用单元测试、静态检查、截图、页面可打开或 HTTP 200 替代。
      - 浏览器 E2E 必须使用 ego-browser 技能：先读取目标环境技能并运行 ego-browser skill，遵循当前版本指南操作真实本地应用；不得用静态 mock/demo 页面、测试替身或伪造成功页面替代被验收业务链。
      - 按项目文档启动所需前后端及依赖，使用隔离端口、临时数据库和测试账号；服务实际加载版本必须对应冻结 candidate_sha。记录启动命令、工作目录、端口/URL、版本核验及就绪证据；不得复用身份不明的旧服务或重启生产服务。
      - 从 spec/需求与本次影响面选择关键用户旅程，使用 ego-browser 实际输入、点击、提交并检查结果，覆盖至少一条完整业务主路径及相关失败/边界路径；跨持久化功能须验证写入后的读取/刷新/重新打开，必要时核对 API/数据库，不能只看成功提示。
      - 保存可回放步骤、预期/实际结果、截图或浏览器记录及后端状态回读证据，并绑定 workflow/task/run 与 candidate_sha；报告不得含凭据或未脱敏敏感数据。测试结束仅清理由本任务启动且身份明确的服务及临时资源。
      - '只有真实本地服务 E2E 全部必要场景通过且其他必需验收也通过，才允许 HERDR_GATE_VERDICT: pass。未运行、跳过、失败、技能缺失、环境未就绪或证据不足均须 HERDR_GATE_VERDICT: blocked，说明原因并交主控恢复/裁决；不得标为不适用后放行，也不得以 unknown 当 PASS。'
      - "单工位独立黑盒测试（严格限定 1 个 Task / 1 个 Pane）。"
      - "跨阶段 Agent 隔离与柔性降级：优先排除工坊阶段（craft）Agent 独立执行，杜绝自证自清；当排除后候选池耗尽时支持柔性降级复用并记录审计证据，严禁抛出致命异常阻断流水线。"
      - "以客观验证为主，严禁直接修改业务代码；发现缺陷提报明确缺陷清单与复现步骤。"
      - "必须覆盖极端边界与全量回归套件，针对冻结候选版本（candidate_sha）进行验证。"
      - "门禁结论契约：必须按照契约输出机器可采纳结论（HERDR_GATE_VERDICT: pass 或 blocked）；未发现阻塞缺陷输出 pass，发现阻碍发布的缺陷输出 blocked 触发自动回流到 craft 节点重跑。"
      - "创建 Task 时默认使用 --agent auto。"

  - id: cleanroom_review
    max_tasks_per_node: 4
    label: 3洁净室评审
    node_type: agent
    depends_on: [craft]
    parallel: false
    purpose: 外环洁净室架构与规范独立评审门禁：对代码质量、架构规范、安全合规与极简设计进行客观独立评审。与洁净室测试并行就绪，验证同一冻结 candidate_sha。
    default_integration_mode: none
    default_task_type: test
    agent_policy:
      preferred: [claude, codex, qodercli, opencode, agy, pi, grok, kimi]
      max_concurrency: 1
      parallel: false
      exclude_stage_agents: [craft]
      allow_soft_degrade: true
    gate:
      retry_node: craft
    required_outputs:
      - 代码规范审查结论
      - 架构合理性评估
      - 安全与合规风险评估
      - 极简设计与改进建议
      - "门禁评审结论（HERDR_GATE_VERDICT: pass / blocked）"
    rules:
      - "单工位独立评审（严格限定 1 个 Task / 1 个 Pane）。"
      - "跨阶段 Agent 隔离与柔性降级：优先排除工坊阶段（craft）Agent，坚决杜绝作者自审；当候选池耗尽时支持柔性降级复用并记录审计追踪，杜绝路由死锁。"
      - "重点审查范围蔓延、未处理异常、安全合规漏洞与过度设计；验证对象为冻结 candidate_sha。"
      - "门禁结论契约：结论必须明确（HERDR_GATE_VERDICT: pass 或 blocked）；未发现阻塞缺陷输出 pass，存在必须返工的阻塞缺陷输出 blocked 触发结构化返工流程回流到 craft 节点。"
      - "创建 Task 时默认使用 --agent auto。"

  - id: wrapup
    max_tasks_per_node: 1
    label: 4收尾
    node_type: agent
    depends_on: [cleanroom_test, cleanroom_review]
    parallel: false
    purpose: 双门禁汇聚门禁与标准交付收尾：校验洁净室双门禁通过与版本一致性，执行六步收尾程序（six-step-finish），回填知识库，建立交付 PR 并收拢现场。
    artifact_mode: shared_artifacts
    default_integration_mode: none
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, opencode, codex, agy, pi, grok, kimi]
      max_concurrency: 1
      parallel: false
      exclude_stage_agents: [craft]
      allow_soft_degrade: true
    gate:
      retry_node: craft
    required_outputs:
      - 六步收尾报告（含逐步状态表）
      - 最终交付成果说明与修改文件清单
      - 双门禁（测试与评审）汇聚验证结论
      - 交付 PR URL 与合并指引
      - 文档与知识库更新说明
    rules:
      - "单工位收尾（严格限定 1 个 Task / 1 个 Pane）。"
      - "汇聚洁净室测试与洁净室评审结论，确认冻结 candidate_sha 一致性及双门禁 PASS 后方可推进。"
      - "执行者独立性与柔性降级：优先排除工坊阶段（craft）Agent 由独立客观视角核查全流程；当候选池受限时支持开启柔性降级（allow_soft_degrade: true）安全复用，杜绝收尾死锁。"
      - "必须使用 six-step-finish 技能执行收尾，禁止自创收尾流程。"
      - "交付 PR 前置（必做）：必须在完成六步收尾步骤 1-2（知识沉淀/wiki 回填并提交）之后、执行步骤 3（合并确认）之前，完成『交付 PR』——首选平台交付入口 `herdr-task create-pr`。硬约束：严禁自动合并；严禁 --force / --yes；不得改写交付分支历史；PR URL 与目标 base 必须写入收尾报告。"
      - "明确区分工作流交付完成与 PR 合并：创建交付 PR 并输出状态表后即代表本工作流收尾交付完成，严禁在收尾中自动执行 PR 合并。"
      - "创建 Task 时默认使用 --agent auto。"
