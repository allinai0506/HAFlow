name: software-development-v1
label: 软件开发标准流程
version: "1.1"
description: 标准 6 阶段软件开发与评审流程 (需求分析 -> 计划 -> 实现 -> 测试 -> 评审 -> 收尾)。按 unified-dev-flow 的阶段思想执行：HAFlow 是唯一主控，各节点只调用对应技能。需求由一人起草；计划保留一次方案对抗。默认交付到工作区，PR、合并和部署要另有授权。

# 统一开发流程映射。不在节点里再启动 speckit-chain、executing-plans、
# autopilot 或第二套工作流。
# requirements    = S0 准备 + S1 意图 + S2 规格
# plan            = S3 计划。对抗只评审，不改写成第二份方案
# implementation  = S4 实现。先有失败证明，离开前做删除式清理
# test            = S5 按计划里的证明方式做新鲜验证
# review          = S6 独立评审。同一候选打回三轮仍不通过就停给人
# wrapup          = S7 收尾 + S8 沉淀。停在需求记下的交付上限

# 选择性重新验证策略 (Scheduler v1 / PR #108)
#
# 语义是「显式声明明确不会影响的路径」,不是「声明哪些文件要重测」。
# 未在此声明的路径一律视为可能影响 verifier;未声明的 verifier 一律重跑。
# 因此新增目录(如 engine-v2/**)不会因为「没配置」而被误判为安全。
#
# 范围刻意收窄到 docs/**/*.md:仓库根的 AGENTS.md / CLAUDE.md / README.md /
# RULES.md 是运行时读取的 Agent 行为契约,不是纯文档,故不在范围内。
# .herdr-loop/*.md(评估器/投影/监督读取)同样不在范围内。
# docs/context/*.txt 亦不在范围内(后缀非 .md)。
reverification:
  version: selective-reverification-v1
  test:
    reusable_only_if_changes_within:
      - "docs/**/*.md"
  # v1 永远重跑评审:评审的价值正在于看到新代码。
  # 空列表表示「不存在安全复用范围」,不是「任何改动都可复用」。
  review:
    reusable_only_if_changes_within: []

# 选择性返工策略 (Selective Replan v1 / PR #110)
#
# 语义是「Verifier 在结构化门禁结论中显式点名受影响的实现 Task」,
# 不是「系统根据 blocker 文本/文件名/依赖图推测影响面」。
# 唯一允许的依据是 Gate Verdict JSON 的 affected_task_ids 字段;
# 缺失、为空、任一 ID 无法机器校验(不存在/跨 workflow/不在 retry_node/
# 非当前谱系头/状态不可替换)或门禁身份链无法证明时,整个 selective
# 决策被拒绝并回退 legacy fix-loop(Fail-Closed,绝不部分接受)。
selective_replan:
  version: selective-replan-v1
  mode: explicit_task_targets
  retry_node: implementation

nodes:
  - id: requirements
    max_tasks_per_node: 1
    label: 2需求分析
    node_type: agent
    depends_on: []
    parallel: false
    purpose: 理解需求、澄清范围、识别约束、形成可验收需求规格。
    default_integration_mode: none
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, opencode, codex, agy, pi, grok, kimi]
      max_concurrency: 1
      roles:
        - name: executor
          label: 需求主起草与边界澄清
          goal: 梳理需求范围、业务规则与清晰可验收标准
          purpose_suffix: 负责主干内容输出、需求澄清与验收方案制定
          outputs:
            - 需求规格与验收标准
            - 需求目标与功能范围
            - 非目标与业务规则约束
    required_outputs:
      - 需求规格与验收标准
      - 需求目标
      - 功能范围
      - 非目标与边界
      - 业务规则
      - 关键约束
      - 风险与待确认事项
    rules:
      - 严格限定 1 个 Task / 1 个 Pane：只做需求起草与边界澄清。对抗审查留在计划节点，不在本节点再开审查工位。
      - 先读 unified-dev-flow 技能再写规格。HAFlow 是唯一主控，本节点不启动 speckit-chain、executing-plans、autopilot 或第二套工作流。已有规格和现场对得上就接着写，对不上再重开。
      - 规格写清四件事：问题与假设、最小改动和文件、不做什么、用哪条命令证明。意图用 brainstorming 收口。验收要能失败，不把百分百边界写进这一轮。
      - 写明意图（缺陷、功能、重构、迁移或配置）、复杂度（微、小、中、大）、风险、证明方式和交付上限。需求没有授权推送、PR、合并或部署时，交付上限记为工作区。
      - 严禁按前端、后端、数据库、UI 切割细碎 Pane。
      - 以分析和方案输出为主，默认不得修改业务代码，不得直接进入实现阶段。
      - 需求规格与验收标准完备即可进入计划。
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。

  - id: plan
    max_tasks_per_node: 2
    label: 3计划
    node_type: agent
    depends_on: [requirements]
    parallel: true
    purpose: 把已确认需求转化为可并行执行、可验收的工程任务，明确任务解耦边界与依赖拓扑。
    default_integration_mode: none
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, codex, opencode, agy, pi, grok, kimi]
      max_concurrency: 2
      roles:
        - name: executor
          label: 技术架构与解耦拆分
          goal: 技术方案设计、工程架构规划与可解耦独立任务拆解
          purpose_suffix: 负责技术架构设计、工程方案与任务拆解
          outputs:
            - 技术架构与解耦任务拆解
            - 实现方案
            - 任务拆分与依赖关系
            - 每个 Task 目标与验收标准
        - name: challenger
          label: 方案对抗性审查与可行性评估
          goal: 破防式审查技术方案、审查死锁与复杂度、过度设计质询与可行性评估
          purpose_suffix: 负责方案对抗性审查、死锁/复杂度质询与可行性风险评估
          outputs:
            - 方案对抗审查与可行性风险评估
            - 风险与验证方案
    required_outputs:
      - 技术架构与解耦任务拆解
      - 方案对抗审查与可行性风险评估
      - 实现方案
      - 任务拆分与依赖关系
      - 每个 Task 的目标与验收标准
      - 风险与验证方案
    rules:
      - 严格限定最多 2 个 Task / 2 个 Pane：1 个主架构师（技术方案制定与任务解耦拆分），1 个对抗性质询者（架构合理性、循环依赖、过度设计与技术风险审查）。严禁开设第 3 个及以上 Task 或 Pane。
      - 计划按 writing-plans 写：每个实现任务有文件范围、验收命令和放弃的做法。有结构变化时用 architect 定边界。微改动只列文件和证明命令，不单拆架构。
      - 对抗工位按 plan-eng-review 只挑问题：循环依赖、过度拆分、验收跑不起来。不改写成第二份方案，不另开实现工位。
      - 承接需求基线原则：直接继承 requirements 已确认需求规格与约束，严禁在计划阶段重复进行需求分析或范围定义。
      - 解耦拆分与并发依据：计划阶段制定的“任务拆分”是为后续实现阶段规划的，严禁在计划阶段提前为每个拆分子任务开设 Pane！必须明确各子任务修改文件预估与重叠分析，无文件冲突且解耦时方作为实现阶段并发的事实依据；同时为每个 Task 制定独立验收标准，支撑后续 Selective Replan 精准定位。
      - 默认不得修改业务代码。
      - 两份核心产出均完备方可通过门禁推进。
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。

  - id: implementation
    max_tasks_per_node: 12
    label: 4实现
    node_type: agent
    depends_on: [plan]
    parallel: true
    purpose: 按照计划完成真实代码实现，支持解耦任务受控并发与独立自测。
    default_integration_mode: git
    default_task_type: feat
    agent_policy:
      preferred: [opencode, codex, qodercli, agy, claude, pi, grok, kimi]
      parallel: true
      max_concurrency: 3
    required_outputs:
      - 代码实现
      - 修改文件说明
      - 必要测试
      - 风险说明
    rules:
      - 严格按照 Task 定义的范围执行，必须保证修改仅局限于 Task 目标内。
      - 缺陷和功能先按 test-driven-development 留下会失败的证明，再写实现。改动停在计划点名的文件里。
      - 离开本节点前用 ai-slop-cleaner 做删除式清理，去掉死代码和重复包装。清理后的代码才算本节点交付。不在本节点推送、建 PR 或再开一条工作流。
      - "预算与并发控制：max_tasks_per_node 为 12（节点全生命周期累计最大任务预算，包含返工补派），max_concurrency 为 3（同时运行并发上限）。"
      - 自适应解耦并发原则：仅当计划阶段拆解的任务完全解耦且修改文件互不重叠时，允许派发多 Agent 并发执行（上限 3 个）；若模块强耦合或属于单点重构，必须强制单 Agent 顺序执行，严禁无序切碎制造 Git 合并冲突与 Pane 膨胀。
      - 提交前必须自测，确保修改与验收标准一致。
      - 规范与集成治理：Worker Agent 仅在本地克隆工作区自测，严禁直接向远端执行 git push 或提 PR，严禁随意切换或重命名 Git 分支，所有代码交付与集成由流水线控制器统一收编。
      - 禁止使用普通 git status 判断修改范围，必须以 verify-baseline 为准。
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。

  - id: test
    max_tasks_per_node: 4
    label: 5测试
    node_type: agent
    depends_on: [implementation]
    parallel: false
    purpose: 独立验证实现结果是否满足需求与验收标准。与 review 节点并行执行，针对同一冻结 candidate_sha。
    default_integration_mode: none
    default_task_type: test
    agent_policy:
      preferred: [codex, opencode, qodercli, claude, agy, pi, grok, kimi]
      max_concurrency: 1
      exclude_stage_agents: [implementation, wrapup]
    required_outputs:
      - 测试执行记录
      - 缺陷清单
      - 回归测试结果
      - 边界条件验证情况
      - "门禁测试结论（HERDR_GATE_VERDICT: pass / blocked）"
      - 本地服务启动与候选版本核验记录（命令、工作目录、URL、隔离环境）
      - ego-browser 真实 E2E 报告（步骤、预期/实际结果、业务主路径及失败边界）
      - E2E 截图/浏览器记录与状态回读证据（绑定候选 SHA 和 Task/Run）
    rules:
      - 按计划写明的证明方式做新鲜验证，并读取 verification-before-completion。验证对象是实现节点清理之后的同一个冻结 candidate_sha。命令、退出码和结论写入记录。旧结果不能证明已经改过的代码。
      - 计划或需求把证明方式定成界面旅程，或这次改动用户能在界面上看到时，真实 E2E 才是必过项，并使用 ego-browser。这时不得用单元测试、静态检查、截图、页面可打开或 HTTP 200 替代，也不得标成不适用。
      - 证明方式是测试命令、静态检查或配置校验时，必须实跑计划里的命令。没跑、失败或证据不足就是 blocked。非界面改动不要强开浏览器。
      - 浏览器 E2E 必须使用 ego-browser 技能：先读取目标环境技能并运行 ego-browser skill，遵循当前版本指南操作真实本地应用；不得用静态 mock/demo 页面、测试替身或伪造成功页面替代被验收业务链。
      - 按项目文档启动所需前后端及依赖，使用隔离端口、临时数据库和测试账号；服务实际加载版本必须对应冻结 candidate_sha。记录启动命令、工作目录、端口/URL、版本核验及就绪证据；不得复用身份不明的旧服务或重启生产服务。
      - 从 spec/需求与本次影响面选择关键用户旅程，使用 ego-browser 实际输入、点击、提交并检查结果，覆盖至少一条完整业务主路径及相关失败/边界路径；跨持久化功能须验证写入后的读取/刷新/重新打开，必要时核对 API/数据库，不能只看成功提示。
      - 保存可回放步骤、预期/实际结果、截图或浏览器记录及后端状态回读证据，并绑定 workflow/task/run 与 candidate_sha；报告不得含凭据或未脱敏敏感数据。测试结束仅清理由本任务启动且身份明确的服务及临时资源。
      - '该跑的证明没有实跑、失败、技能缺失、环境未就绪或证据不足时，HERDR_GATE_VERDICT 必须是 blocked，并说明原因。不得标成不适用后放行，不得用 unknown 当 pass。界面旅程只有真实本地服务 E2E 的必要场景通过，才允许 pass。'
      - 单工位专注执行（严格限定 1 个 Task / 1 个 Pane）。
      - 跨阶段 Agent 硬隔离红线（一等公民）：测试 Agent 严禁复用实现（implementation）阶段的主要 Agent！必须由不同的 Agent 独立运行测试与边界核验，杜绝思维惯性与“自证自清”。
      - 以验证为主，不得随意修改代码；发现问题必须提报明确缺陷清单与复现步骤。
      - 必须覆盖计划阶段制定的验证方案与对抗审查提出的极端边界。
      - 测试必须针对 Candidate 分支或隔离 Clone 进行验证。
      - 关键路径并行声明（Scheduler v1）：本节点与 review 节点在 implementation 完成后同时就绪并行执行；两者必须验证同一个冻结候选版本（candidate_sha，由派发时注入），严禁各验证各的版本；最终由 wrapup 汇聚门禁做确定性 SHA 一致性校验后方可收尾。
      - "门禁结论契约：必须按照契约输出机器可采纳结论（HERDR_GATE_VERDICT: pass 或 blocked）；未发现阻塞缺陷时为 pass，发现阻碍发布的缺陷时为 blocked 并触发返工。"
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择（自动排除实现阶段 Agent）；只有存在明确理由或用户显式指定时才固定具体 Agent。

  - id: review
    max_tasks_per_node: 4
    label: 6评审
    node_type: agent
    depends_on: [implementation]
    parallel: false
    purpose: 对代码质量、架构、安全性和可维护性进行独立评审。与 test 节点并行执行（同 implementation 前置），验证同一冻结 candidate_sha。
    default_integration_mode: none
    default_task_type: test
    agent_policy:
      preferred: [claude, codex, qodercli, opencode, agy, pi, grok, kimi]
      max_concurrency: 1
      exclude_stage_agents: [implementation, wrapup]
    required_outputs:
      - 代码规范审查结论
      - 架构合理性评估
      - 安全风险评估
      - 改进建议与结论
      - "门禁评审结论（HERDR_GATE_VERDICT: pass / blocked）"
    rules:
      - 单工位独立评审（严格限定 1 个 Task / 1 个 Pane）。
      - 按 google-code-review 评审；仓库指定了自己的审查技能时用那个技能。评审只下结论，不改实现。没有阻塞缺陷才是 pass，有阻塞缺陷就是 blocked。
      - 同一候选被评审打回累计三轮仍不通过，就停止再派，写明需要人工处理。实现在评审之后又改了代码，这一轮结论作废，必须重测重审。
      - 跨阶段 Agent 硬隔离红线（一等公民）：评审 Agent 严禁复用实现（implementation）阶段的主要 Agent！坚决杜绝实现者自己评审自己的代码。
      - 评审必须独立执行，重点检查范围蔓延、未处理异常和潜在性能缺陷；验证对象必须为派发注入的冻结 candidate_sha。
      - "门禁结论契约：结论必须明确（HERDR_GATE_VERDICT: pass 或 blocked）；未发现阻塞缺陷时输出 pass，存在必须返工的阻塞缺陷时输出 blocked 触发返工流程。"
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择（自动排除实现阶段 Agent）；只有存在明确理由或用户显式指定时才固定具体 Agent。

  - id: wrapup
    max_tasks_per_node: 1
    label: 7收尾
    node_type: agent
    depends_on: [test, review]
    parallel: false
    purpose: >
      确认整个 Workflow 完成。必须使用 six-step-finish（六步收尾）技能
      作为标准收尾程序，产出包含逐步（0-6）状态表与 PR 审核闭环证据的
      收尾报告。汇总成果、风险和交付信息。
    artifact_mode: shared_artifacts
    review_closure_required: true
    default_integration_mode: none
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, opencode, codex, agy, pi, grok, kimi]
      max_concurrency: 1
      exclude_stage_agents: [implementation]
    required_outputs:
      - 六步收尾报告（含逐步状态表：步骤/执行者/命令/结果/证据，且固定包含「PR URL / CI 状态 / 审核 findings 状态」三列信息）
      - 最终交付成果说明与修改文件清单
      - 交付 PR URL 与合并指引
      - PR 审核闭环证据（CI 检查结果 + 评审 findings 清单与逐条处置结论）
      - 遗留问题与后续建议
    rules:
      - 单工位收尾（严格限定 1 个 Task / 1 个 Pane）。
      - 交付停在需求记下的上限。上限是工作区时，不推送、不建 PR、不合并、不部署；下面的 PR 与审核闭环条款整段跳过，只核对工作区证据并调用 knowledge-capture。上限包含 PR 时才执行那些条款，并且仍然不自动合并。合并和部署必须另有明确授权。
      - 执行者独立性红线：收尾 Agent 严禁复用实现阶段 Agent，由独立客观视角核查全流程交付清单并执行收尾。
      - 必须核对全流程所有阶段的交付物是否完备，汇聚确认 test 与 review 均基于同一 candidate_sha 判定 pass，负责生成交付汇总和合并指引。
      - 必须使用 six-step-finish 技能执行收尾，禁止自创收尾流程。技能说明（仓库内）：.agents/skills/six-step-finish/SKILL.md；收尾脚本（仓库内）：.agents/skills/six-step-finish/scripts/finish-task.sh；绝对兜底：~/.agents/skills/six-step-finish/。基准分支必须显式传入：--base <本工作流 base_branch，见 stage advance 事件头部 base_branch 字段>。
      - "收尾候选更新：知识/Wiki/文档以及审核修复属于交付内容，必须先固定这些内容，再运行 herdr-task commit <wrapup-task-id> --message <说明> 和 herdr-task integrate <wrapup-task-id>；此时 wrapup 保持 working/agent_done，不先申报 completed。Controller 消费集成发布，冻结新 candidate_sha，退役旧 test/review 并按正常事件重新派发二者（文档也不复用旧 pass）。用 herdr-task get <task-id> 与 note-list <workflow-id> 查看进度；中断后重复同一命令恢复，不改状态或数据库。"
      - "交付 PR 前置：无新增提交时沿用已认证上游任务。新增提交时等待本轮独立 test/review 对同一冻结 SHA 的 pass、业务验收及 Artifact 回执齐备，再运行 herdr-task record-delivery --workflow-id <workflow-id> --delivery-branch <wrapup_delivery.publication_branch> --candidate-sha <最终集成SHA> --review-task <本轮review> --test-gate <本轮test> --base <base_branch> --supersedes <旧delivery_id>，然后 herdr-task create-pr <wrapup-task-id> --title <标题> --body-file <说明文件>。平台在候选专属分支创建或恢复替代 PR，记录前驱 PR，保留旧 PR 校验且不覆盖旧分支。禁止自行 push/建 PR、人工改状态、deferred 绕过或自动合并。"
      - "报告顺序：属于 PR 的代码、知识和报告正文在最终认证前提交固定。等待验证期间保留唯一 wrapup；不得完成它或新建第二个 wrapup。PR/CI/findings 与最终运行状态追加到 clone 外 checkpoint-publish/checkpoint-aggregate 产物，再记录同 head 的 record-review-closure 并正常申报完成；不得在回执后提交报告。审核修复形成 Z 时重复上述受控路径，最多三轮并受现有 verifier 累积预算约束，耗尽或失败按现有阻断/返工政策处理。"
      - "PR 审核闭环（必做，2026-10-16 引入；wf-haflow-1015-01 事故教训）：交付 PR 创建/确认成功后，必须在申报完成前抓取并处理该 PR 的机器审核结果——CI/必过检查与评审 findings（GitHub：`gh pr checks <n> --repo <owner>/<repo>`、`gh api --paginate repos/<owner>/<repo>/pulls/<n>/reviews`、`gh api --paginate repos/<owner>/<repo>/pulls/<n>/comments`——两处必须带 `--paginate` 并聚合全部页，否则多页 PR 会漏报后页 findings；Gitee/GitLab 用对应入口）。硬条件：① 必过 CI 全绿；② 无未决 P1 级 finding（发现即需在交付分支追加修复提交并重跑复验，禁止改写历史）；③ P2/P3 finding 逐条处置或明示豁免理由；④ findings 数、处置动作与复验证据写入收尾报告与状态表；⑤ 闭环完成后必须运行 `herdr-task record-review-closure <task-id> --pr-url <URL> --ci-status pass --unresolved-p1 0 --unresolved-p2 <n> --findings '<P2/P3 处置>' --head-sha <被审的 40-hex 提交>` 落**机器回执**（内容校验 + **forge 实证（GitHub）**：非 deferred 须 CI=pass、结构化计数 P1=0、findings 非空，且写入前经 gh 实证——PR URL 可识别、PR head 与 --head-sha 一致、`gh pr checks` 全绿、无未决 Codex P1/P0 评审线程、**该 head 存在已完成的 Codex 审核记录**（codex-review-state=completed 且 commit_sha 匹配；空线程列表 ≠ 已审核）；gh 不可用或任一校验失败即拒绝。非 GitHub forge 暂不支持机器实证：以 `--deferred --reason '<命令+错误输出>'` 记录（平台附 remote 探测证据；**存在 GitHub remote 时 deferred 不被接受**，必须走 PR 路径））；回执**绑定被审 head**——完成时与工位克隆 HEAD 比对，head 之后再产生提交（如修 findings）或 head 不可验证时一律拒绝；回执 PR 还必须与**交付身份**一致（工作流 `pull_request_created` 记录的交付 PR / 项目 GitHub remote 的 owner/repo），且**完成转换时会再次实证 forge 状态**（记录后 CI 转红或新增未决 P0/P1 即失效，须重新闭环重录）。wrapup 任务置 completed 时（含控制器 auto-accept 与 bypass-gate 直写路径）平台 fail-closed 校验该回执，缺失/失效将被拒绝；应急豁免须用 `--skip-review-closure --operator <id> --note '<审计原因>'` 并具备操作员能力 `HERDR_OPERATOR=1`（豁免同样绑定当前 head，rework 后过期）。CI 未跑完、存在未决 P1、或审核入口不可达且未记录原因时，不得申报收尾完成（属未完成，不得以 DEFERRED 规避）。"
      - "职责单一性：PR 创建与审核闭环是收尾任务自身职责，不得以『属控制器职责』为由跳过；DEFERRED 仅在平台入口与项目回退双路径都实测不可用时允许，且必须附实测证据（执行的命令 + 错误输出）与人工建议动作。"
      - "六步收尾执行规则：(1) 先完成步骤 1（调用 knowledge-capture），知识更新与交付物同分支提交；再执行步骤 2（wiki checkpoint），仓库无 .wiki/WIKI.md 时脚本自动跳过，但仍须按 AGENTS.md wiki 治理判断是否回填 wiki/；(2) 步骤 3 的合并确认只读执行（--dry-run），且必须先确认目标分支相对 base 至少有 1 个提交（零提交分支会被 git cherry 误判为已合入）；运行 finish-task.sh 前必须先检查目标分支是否存在（如 `git show-ref --verify --quiet refs/heads/<branch>`），分支不存在 → 报告「已清理/无资源」并跳过脚本，不得记为失败；(3) 已建 PR 但未合入 → 记录 ⛔ 与 DEFERRED，产出收尾计划与合并指引（必须含 PR URL）；严禁 --force；(4) 严禁 --yes（会丢弃未提交变更）；破坏性步骤须在 base 合入后执行；(5) 不得删除 clone / pane / 阶段 tab（close-workflow 的职责）；(6) 收尾报告必须含六步状态表；(7) 明确区分工作流交付完成与 PR 合并：创建交付 PR 并输出状态表后即代表本工作流收尾交付完成，严禁在收尾中自动执行 PR 合并；(8) PR 审核闭环前置：建 PR 后、合并确认（步骤 3）前，必须完成审核闭环（CI 全绿 + 未决 P1=0 + findings 逐条处置，见『PR 审核闭环』规则）；存在待修 findings 时在交付分支追加提交并复验，全部闭环后方可申报完成；**修复提交的再门禁**：向已认证的交付分支追加提交会使既有认证失效——平台路径必须重走 test/review 并对新提交产生新的有效交付身份（`_matching_pr` 拒绝已移动 head 的旧 PR，勿继续依赖旧 delivery record）；forge 回退路径必须对**新 head** 重新触发审核（如 `@codex review`）并重新核验 CI 与 findings；严禁以旧审核结果放行已变更的 head；(9) 状态表新增固定三列：PR URL / CI 状态 / 审核 findings 状态（含未决 P1、P2 数量与处置），缺任一项视为收尾未完成。"
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择（自动排除实现阶段 Agent）；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 收尾完成后，标记整个 Workflow 进入完成状态，提醒用户执行物理 purge 或保留现场供复查。
