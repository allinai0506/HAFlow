name: business-research-v1
label: 跨部门商业调研与竞品财报分析
version: "1.0"
description: 面向商业投研、市场洞察与战略分析的通用协同图谱。涵盖研究范围定义、多渠道公开数据抽取、多维业务比对与决策简报会签。

nodes:
  - id: market_scope
    label: 市场与竞品范围界定
    node_type: agent
    purpose: 明确分析目标领域、核心竞品标的清单与关键财务比对维度
    default_task_type: docs
    worker_policy:
      preferred: [claude, codex]
      capabilities: [research]
      permissions: [read_only]
    inputs:
      - ref: context.user_goal
    required_outputs:
      - docs/scope.md

  - id: data_extraction
    label: 财务数据与公开情报抓取
    node_type: agent
    depends_on: [market_scope]
    purpose: 抽取竞品近 4 个季度的财报附注、主营业务收入结构及公开发言要点
    default_task_type: docs
    worker_policy:
      preferred: [opencode, codex]
      capabilities: [web_search, data_extraction, financial_excel_calc]
      permissions: [read_only]
    inputs:
      - ref: nodes.market_scope.outputs
    required_outputs:
      - docs/financial_metrics.csv
      - docs/data_source.md

  - id: comparative_analysis
    label: 商业洞察与横向多维比对
    node_type: agent
    depends_on: [data_extraction]
    purpose: 交叉校验各家毛利异动原因、供应链成本结构及潜在竞争风险
    default_task_type: docs
    worker_policy:
      preferred: [claude, codex]
      capabilities: [analysis, data_extraction, document_generation]
      permissions: [read_write]
    inputs:
      - ref: nodes.data_extraction.outputs
    required_outputs:
      - docs/comparative_report.md

  - id: executive_briefing
    label: 高管决策简报会签
    node_type: gate
    depends_on: [comparative_analysis]
    purpose: 汇总结算汇报，供人类总指挥进行战略决策与最终会签
    default_task_type: test
    worker_policy:
      capabilities: [signoff, compliance]
      permissions: [require_approval]
    inputs:
      - ref: nodes.comparative_analysis.outputs
    gate:
      type: hybrid
      requires_human_approval: true
      auto_criteria: "len(artifacts) >= 3"
      retry_node: data_extraction
      retry_target: data_extraction
    required_outputs:
      - docs/executive_summary.md
