id: close_workflow
name: 关闭工作流
description: 工作流收尾：原子进入 closing 闩，逐任务 finalize，条件满足后 completed；pending、paused、failed 仅可经 --force。
lifecycle: experimental
target: workflow_instance
inputs:
- workflow_id
- force
- abandon
- dry_run
preconditions:
- workflow_transition_allowed
authorization:
  policies:
  - controller_service_policy
  - operator_cli_policy
effects:
  state_transition:
    state_machine: workflow_lifecycle
    from: running|in_progress
    to: closing -> completed
    out_of_matrix: pending|paused|failed 仅经 --force（见 workflow_lifecycle.out_of_matrix_writers）
side_effects:
- 逐任务 finalize（_finalize_one）
- 关闭协调器窗格（报告字段 coordinator_closed）
- stage_reset
idempotency:
  strategy: closing_latch
  key: workflow_id
transaction:
  mode: atomic_latch_then_per_task
  owner: bin/herdr-task close-workflow
audit:
  required: true
  event: workflow_transition
failure_behavior:
  retry: safe_only
  compensation: closing 保留，供人工处理
bindings:
- connector: herdr_task_cli
  operation: close-workflow
- connector: herdr_controller_service
  operation: maybe_close_completed_workflow
verification:
  strategy: reread_target
  target: state.db workflows.status
evidence:
- kind: implemented
  source: bin/herdr-task
  locator: close-workflow preflight L5497-5502 / closing 迁移 L5677-5680 / _mark_workflow_completed L5273-5300 / completed 调用 L5810
  confidence: high
- kind: implemented
  source: services/herdr-controller.py
  locator: maybe_close_completed_workflow L844-905（dispatch L901）
  confidence: high
