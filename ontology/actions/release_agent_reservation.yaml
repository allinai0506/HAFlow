id: release_agent_reservation
name: 释放 Agent 预占
description: 任务正式注册或派发失败/回收时显式释放预占锁。
lifecycle: experimental
target: agent_reservation
inputs:
- task_id
preconditions:
- agent_reservation_ttl_bounded
authorization:
  policies:
  - controller_service_policy
  - operator_cli_policy
effects:
  deletes:
  - agent_reservation
side_effects:
- flock 写 agent-reservations.json
idempotency:
  strategy: business_key
  key: task_id
transaction:
  mode: file_locked
  owner: herdr.agent_router.release_agent_reservation
audit:
  required: false
  notes: 释放行为记录在路由上下文与事件中（视调用方）
failure_behavior:
  retry: always_safe
  compensation: none
bindings:
- connector: herdr_core_lib
  operation: herdr.agent_router.release_agent_reservation
verification:
  strategy: reread_target
  target: agent-reservations.json 无该 task_id
evidence:
- kind: implemented
  source: herdr/agent_router.py
  locator: L283-297
  confidence: high
- kind: implemented
  source: bin/herdr-task
  locator: L4263-4265, L5195-5196
  confidence: high
