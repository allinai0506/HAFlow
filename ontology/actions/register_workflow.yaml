id: register_workflow
name: 注册工作流 Run
description: 为项目创建并注册一次工作流运行实例，冻结定义快照，直接将状态置为 running（标准装配初始态），并记录权威创建事件。
lifecycle: experimental
target: workflow_instance
inputs:
- workflow_id
- project_id
- title
- requirement
- workflow_file（可选）
- context（可选）
- metadata（可选）
preconditions:
- workflow_dag_acyclic
authorization:
  policies:
  - controller_service_policy
  - operator_cli_policy
effects:
  creates:
  - workflow_instance
  state_transition:
    state_machine: workflow_lifecycle
    from: （无）
    to: running
    note: 标准装配工作流生命周期起点确立为 running，pending 保留为未装配/草稿通道（ADR-0007 / SC-011）
  sets:
    status: running
side_effects:
- 冻结 Run 定义快照 workflows/<id>/workflow.json（失败则不注册，L573-577）
- 初始化 node_runtime 映射
idempotency:
  strategy: generated_id
  key: wf-{slug}-{MMDD}-{seq}
transaction:
  mode: snapshot_then_store
  owner: herdr.projects.register_workflow
audit:
  required: true
  event: workflow_created
  notes: ADR-0007 明确补齐权威生命周期审计事件，终结裸写无事件历史债务
failure_behavior:
  retry: safe_only
  compensation: none
bindings:
- connector: herdr_factory_cli
  operation: run
- connector: herdr_core_lib
  operation: herdr.projects.register_workflow
verification:
  strategy: reread_target
  target: state.db workflows[workflow_id]
evidence:
- kind: implemented
  source: herdr/projects.py
  locator: register_workflow L551-603 / freeze_run_definition L510-577
  confidence: high
- kind: implemented
  source: bin/herdr-factory
  locator: run 子命令 L833
  confidence: high
notes: D3 / ADR-0007 落地：工作流创建升格为一等动作，标准装配初始态定案为 running。
