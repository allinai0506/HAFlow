id: provision_project
name: 供给项目空间
description: 注册项目并创建 Herdr Workspace/节点 Tab 现场与共享工作流定义文件。
lifecycle: experimental
target: project
inputs:
- project_root
- template_name
- project_name
preconditions: []
authorization:
  policies:
  - operator_cli_policy
effects:
  creates:
  - project
  - workflow_definition（共享模板文件）
side_effects:
- 创建 Herdr Workspace/Tab/Pane（现场）
- 写 projects/<project_id>/workflow.json 后再写 projects.json
idempotency:
  strategy: business_key
  key: project_root（canonical path）
transaction:
  mode: file_then_registry
  owner: herdr.projects.ensure_project -> provision_project
  note: 非单事务：工作流文件先写，projects.json 后写
audit:
  required: false
  notes: 未发现专门的注册事件（审计缺口，SKILL §10 要求）
failure_behavior:
  retry: unknown
  compensation: none
bindings:
- connector: herdr_factory_cli
  operation: project
- connector: herdr_core_lib
  operation: herdr.projects.ensure_project
verification:
  strategy: reread_target
  target: projects.json[project_root]
evidence:
- kind: implemented
  source: bin/herdr-factory
  locator: project 子命令 L809-812 / project_command L159-166
  confidence: high
- kind: implemented
  source: herdr/projects.py
  locator: ensure_project L1302 / provision_project L877-949 / 写入 L1011-1028
  confidence: high
