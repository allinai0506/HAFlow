id: launch_task
name: 派发任务工单
description: 为节点创建任务、选人、预占、建 CoW 克隆与分支、采样基线并派发到窗格。
lifecycle: experimental
target: task
inputs:
- task_id
- workflow_id
- node
- agent
- task_type
- integration_mode
- dispatch_role
preconditions:
- task_transition_allowed
- agent_capacity_within_node_limit
- anchor_pane_never_assigned
authorization:
  policies:
  - operator_cli_policy
effects:
  creates:
  - task
  - agent_reservation
  state_transition:
    state_machine: task_lifecycle
    from: pending
    to: dispatched
    note: launch 先登记 pending，再由 dispatch 迁移到 dispatched（bin/herdr-task L4197, L4244, L4446）
side_effects:
- 创建 CoW 克隆与分支（services/herdr-worker.py）
- 占用窗格
- 写基线指纹与 launch intent
idempotency:
  strategy: intent_guard
  key: task_id + launch_intent（幂等细节 UNVERIFIED）
transaction:
  mode: two_phase_intent
  owner: bin/herdr-task launch
audit:
  required: true
  event: launch_intent / task_transition
failure_behavior:
  retry: bounded_by_launch_intent
  compensation: release_agent_reservation；失败时迁移 failed（L4685）
bindings:
- connector: herdr_task_cli
  operation: launch
- connector: herdr_core_lib
  operation: herdr.agent_router.choose_agent
verification:
  strategy: reread_target
  target: state.db tasks[task_id].status
evidence:
- kind: implemented
  source: herdr/task_cli_parser_execution.py
  locator: launch parser L73-115（--task-type choices L89-101）
  confidence: high
- kind: implemented
  source: herdr/task_cli_launch.py; herdr/task_cli_launch_orchestrator.py
  locator: launch 流程 L10-370 / L10-540
  confidence: high
- kind: implemented
  source: services/herdr-worker.py
  locator: create_clone L132-170 / build_baseline_fingerprint L580-605
  confidence: high
