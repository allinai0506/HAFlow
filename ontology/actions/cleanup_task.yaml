id: cleanup_task
name: 逻辑清理任务
description: 仅在 cleanup_ready 状态允许；只写保留元数据并推进到 cleaned，不关闭窗格、不删除克隆（逻辑清理）。
lifecycle: experimental
target: task
inputs:
- task_id
preconditions:
- task_transition_allowed
authorization:
  policies:
  - operator_cli_policy
effects:
  state_transition:
    state_machine: task_lifecycle
    from: cleanup_ready
    to: cleaned
side_effects:
- 写 resource_retention=persistent、pane_retained=true、clone_retained=true
idempotency:
  strategy: business_key
  key: task_id
transaction:
  mode: store_update
  owner: bin/herdr-task cleanup -> set_status
audit:
  required: true
  event: task_transition
failure_behavior:
  retry: safe_only
  compensation: none
bindings:
- connector: herdr_task_cli
  operation: cleanup
verification:
  strategy: reread_target
  target: tasks.status
evidence:
- kind: implemented
  source: bin/herdr-task
  locator: cleanup_task L4750-4781（logical cleanup only）
  confidence: high
