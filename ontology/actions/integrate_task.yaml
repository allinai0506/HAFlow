id: integrate_task
name: 集成任务成果
description: 将任务分支成果集成到目标分支并记录集成引用，推进 committed -> integrated。
lifecycle: experimental
target: task
inputs:
- task_id
- onto
preconditions:
- task_transition_allowed
authorization:
  policies:
  - operator_cli_policy
effects:
  state_transition:
    state_machine: task_lifecycle
    from: committed
    to: integrated
side_effects:
- 目标分支更新
- 记录 integrated 引用
idempotency:
  strategy: business_key
  key: task_id + integrated sha
transaction:
  mode: git_then_store
  owner: bin/herdr-task integrate
audit:
  required: true
  event: task_transition
failure_behavior:
  retry: safe_only
  compensation: none
bindings:
- connector: herdr_task_cli
  operation: integrate
verification:
  strategy: reread_target
  target: git 目标分支 + tasks.status
evidence:
- kind: implemented
  source: herdr/task_cli_integration.py
  locator: integrate_task L9-410
  confidence: high
