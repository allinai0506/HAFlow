out_of_matrix_writers:
- from: completed
  to: rework
  writer: state_db.transition_task 经 validate_repair_transition（source=delivery-repair）；同时清空 stage_verdict
  evidence:
  - kind: implemented
    source: herdr/state_db.py
    locator: transition_task completed→rework 分支 L6734-6738
    confidence: high
  - kind: implemented
    source: herdr/delivery_rework.py
    locator: transition_task(...'rework', source='delivery-repair') L102-108
    confidence: high
- from: blocked（代码另有 suspended，矩阵中不存在）
  to: completed
  writer: kernel.bypass_task_gate 直接 save_task，不经 transition_task
  evidence:
  - kind: implemented
    source: herdr/kernel.py
    locator: bypass_task_gate L832-957
    confidence: high
- from: paused
  to: working
  writer: kernel.bypass_task_gate 直接 save_task
  evidence:
  - kind: implemented
    source: herdr/kernel.py
    locator: bypass_task_gate L832-957
    confidence: high
- from: 任意非 superseded 状态
  to: superseded
  writer: kernel.rollback_workflow 以 transition_task(force=True) 批量作废
  evidence:
  - kind: implemented
    source: herdr/kernel.py
    locator: rollback_workflow L526-575
    confidence: high
  - kind: implemented
    source: herdr/transitions.py
    locator: validate_task_transition force 分支 L118-119
    confidence: high
- from: 任意状态
  to: agent_done
  writer: console api_task_force_review 直接写 status（无守卫、无事件）
  evidence:
  - kind: implemented
    source: console/task_api.py
    locator: api_task_force_review L266-290
    confidence: high
  - kind: implemented
    source: console/http_server.py
    locator: POST /api/task/force-review L279（无鉴权）
    confidence: high
- from: 任意状态
  to: 任意状态（覆盖写）
  writer: herdr-task add / save_task upsert 覆盖 status；checkpoint restore 先删除 workflow 下全部任务再重建
  evidence:
  - kind: implemented
    source: herdr/state_db.py
    locator: save_task upsert L1714-1731
    confidence: high
    notes: 子代理取证，未逐行复核
  - kind: implemented
    source: herdr/state_db.py
    locator: restore_checkpoint DELETE FROM tasks L7719-7765
    confidence: high
privileged_transitions:
- id: delivery_repair
  name: 交付物修复特权流转
  intent: delivery-repair
  from: completed
  to: rework
  policy: operator_cli_policy
  preconditions:
  - delivery_repair_authorized
  audit:
    required: true
    event: task_transition
    payload:
      source: delivery-repair
      reason: rework_requested
  effects:
    sets:
      stage_verdict: null
  notes: ADR-0005 / D1：仅在交付物修复且授权通过时允许 completed -> rework，网关层原子 CAS 推进并清空 stage_verdict
- id: operator_bypass
  name: 门禁旁路放行特权流转
  intent: operator-bypass
  from: blocked
  to: completed
  secondary_from: paused
  secondary_to: working
  policy: gate_bypass_policy
  preconditions:
  - gate_bypass_audited
  audit:
    required: true
    events:
    - task_transition
    - gate_bypassed
  effects:
    sets:
      stage_verdict: pass
      blocker: null
  notes: ADR-0005 / D1：门禁旁路放行必须走网关完成 blocked -> completed，在 clone_lock 下原子核验 HeadGuard 并记录流转与旁路审计事件
- id: rollback
  name: 工作流回滚特权流转
  intent: rollback
  from: 任意非 superseded 状态
  to: superseded
  policy: operator_cli_policy
  preconditions:
  - rollback_authorized
  audit:
    required: true
    event: task_transition
    payload:
      reason: workflow_rollback
  notes: ADR-0005 / D1：工作流回滚走显式的受控批量流转 * -> superseded，废弃无语义 force=True，附带操作员与原因凭据
- id: console_force_review
  name: 控制台强制复审特权流转
  intent: console-force-review
  from: 任意非 terminal 状态
  to: agent_done
  policy: operator_cli_policy
  preconditions:
  - console_operator_authenticated
  audit:
    required: true
    event: task_transition
    payload:
      source: console-force-review
  notes: ADR-0005 / D1：控制台强制转入人工审查重构为网关 CAS 调用，校验 Origin、CSRF 头及操作员凭据后推进至 agent_done，杜绝裸写 SQL
