id: workflow_lifecycle
name: 工作流生命周期状态机
description: 7 状态工作流状态机；closing 是物理清理前闩，一旦进入拒绝 pause/续跑；completed 可 reopen 回 in_progress。
lifecycle: experimental
object: workflow_instance
initial: pending
terminal: []
