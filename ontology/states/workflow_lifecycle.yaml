id: workflow_lifecycle
name: 工作流生命周期状态机
description: 7 状态工作流状态机，边集与 WORKFLOW_TRANSITIONS 逐边一致。注册时直接写入 running（不经 pending 迁移，SC-011）；closing 为物理清理前的闩；completed 可经 reopen-workflow 回到 in_progress。
lifecycle: experimental
object: workflow_instance
initial: running
terminal: []
states:
- pending
- running
- in_progress
- paused
- closing
- completed
- failed
classification:
  active:
  - pending
  - running
  - in_progress
  - paused
  - closing
  lane_closed:
  - completed
transitions:
- from: pending
  to: running
  trigger: herdr-factory run (register_workflow 直接写 running)
  guards:
  - workflow_transition_allowed
- from: pending
  to: in_progress
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: pending
  to: paused
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: pending
  to: failed
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: running
  to: paused
  trigger: kernel.pause_workflow
  guards:
  - workflow_transition_allowed
- from: running
  to: closing
  trigger: herdr-task close-workflow preflight (原子 closing 闩)
  guards:
  - workflow_transition_allowed
- from: running
  to: completed
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: running
  to: failed
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: running
  to: in_progress
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: in_progress
  to: paused
  trigger: kernel.pause_workflow
  guards:
  - workflow_transition_allowed
- from: in_progress
  to: closing
  trigger: herdr-task close-workflow preflight (原子 closing 闩)
  guards:
  - workflow_transition_allowed
- from: in_progress
  to: completed
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: in_progress
  to: failed
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: in_progress
  to: running
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: paused
  to: running
  trigger: kernel.resume_workflow
  guards:
  - workflow_transition_allowed
- from: paused
  to: in_progress
  trigger: 无观测触发方（kernel.resume_workflow 只写 running；仅矩阵声明）
  guards:
  - workflow_transition_allowed
- from: paused
  to: failed
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: closing
  to: completed
  trigger: herdr-task close-workflow
  guards:
  - workflow_transition_allowed
- from: closing
  to: failed
  trigger: herdr-task close-workflow failure path
  guards:
  - workflow_transition_allowed
- from: completed
  to: in_progress
  trigger: herdr-task reopen-workflow
  guards:
  - workflow_transition_allowed
- from: completed
  to: running
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: completed
  to: closing
  trigger: herdr-task close-workflow preflight (原子 closing 闩)
  guards:
  - workflow_transition_allowed
- from: failed
  to: in_progress
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
- from: failed
  to: running
  trigger: kernel.transition_workflow
  guards:
  - workflow_transition_allowed
evidence:
- kind: implemented
  source: herdr/transitions.py
  locator: WORKFLOW_TRANSITIONS L89-97
  confidence: high
