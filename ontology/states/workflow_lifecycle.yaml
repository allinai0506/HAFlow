initial_declared_in_matrix: pending
initial_note: 矩阵声明 pending 为起点，但 projects.register_workflow 直接写 status=running（projects.py L593）；占位工作流 save_task 以 pending 创建（state_db.py L1617）。
out_of_matrix_writers:
- from: pending|paused|failed
  to: closing（force）
  writer: herdr-task close-workflow --force：validate_workflow_transition(force=True) 跳过边合法性
  evidence:
  - kind: implemented
    source: bin/herdr-task
    locator: close-workflow preflight L7273-7287
    confidence: high
- from: （无）
  to: running
  writer: projects.register_workflow 直接写 status（无迁移记录）
  evidence:
  - kind: implemented
    source: herdr/projects.py
    locator: register_workflow wf_entry L578-603
    confidence: high
