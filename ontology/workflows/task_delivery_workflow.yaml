id: task_delivery_workflow
name: 任务交付闭环
description: 从项目供给到工作流收尾的标准交付编排：供给项目 -> 启动 Run -> 派发 -> 验证 -> 门禁 -> 提交/集成 -> 收尾 -> 关流。
lifecycle: experimental
trigger: 人类操作者执行 herdr-factory run，Controller 按 DAG 就绪推进
steps:
- type: action
  ref: provision_project
  notes: 首次使用或模板切换时
- type: action
  ref: start_workflow
- type: rule
  ref: workflow_dag_acyclic
- type: action
  ref: launch_task
- type: action
  ref: verify_task_baseline
- type: rule
  ref: required_outputs_present
- type: action
  ref: record_gate_verdict
- type: action
  ref: commit_task
  notes: integration_mode=git 时
- type: action
  ref: integrate_task
  notes: integration_mode=git 时
- type: action
  ref: finalize_task
- type: action
  ref: close_workflow
evidence:
- kind: implemented
  source: bin/herdr-factory
  locator: run/start_workflow L403-623
  confidence: high
- kind: implemented
  source: services/herdr-controller.py
  locator: sweep/get_ready_nodes L4888-5096
  confidence: high
- kind: implemented
  source: bin/herdr-task
  locator: close-workflow L7273-7590
  confidence: high
