name: HAFlow Auto PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ha-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Automated Rule & Shadow Review
    runs-on: [self-hosted, haflow]
    if: github.repository == 'allinai0506/HAFlow'
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head commit ref (data only, never checkout)
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        continue-on-error: true

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest || true

      - name: Run Auto PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HOME: /Users/user
          USER: user
          PATH: /Users/user/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          HERDR_SECURE_LLM_RUNNER: "1"
          HERDR_ALLOW_AGY_SHADOW: "1"
          HERDR_AGY_EFFORT: "low"
        run: |
          python3 bin/herdr-review-bench auto-pr-review \
            --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-title "$PR_TITLE" \
            --pr-body "$PR_BODY" \
            --output-dir ".omc/review_artifacts" \
            --github-token "${GITHUB_TOKEN}" \
            --repo-slug "${{ github.repository }}" \
            --agent "rule" \
            --shadow-agent "agy" \
            --timeout 180

      - name: Upload Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .omc/review_artifacts/
          retention-days: 14
